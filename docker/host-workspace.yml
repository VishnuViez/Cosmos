# High-trust host workspace access. Enable only when the Cosmos agent should
# work on a host directory outside the container's normal /app/data sandbox.
#   COMPOSE_FILE=docker-compose.yml:docker/host-workspace.yml
#   COSMOS_HOST_WORKSPACE_DIR=/absolute/host/path
#   COSMOS_HOST_WORKSPACE_MOUNT=/host/workspace
services:
  cosmos:
    volumes:
      - ${COSMOS_HOST_WORKSPACE_DIR:?set COSMOS_HOST_WORKSPACE_DIR}:${COSMOS_HOST_WORKSPACE_MOUNT:-/host/workspace}:rw,z
    environment:
      - COSMOS_HOST_WORKSPACE_MOUNT=${COSMOS_HOST_WORKSPACE_MOUNT:-/host/workspace}
